name: Debian 12 scrcpy 3.3.4 / system SDL2 and FFmpeg / Core 2

on:
  push:
    branches:
      - debian12-3.3.4-sdl2
  workflow_dispatch:

concurrency:
  group: scrcpy-debian12-3.3.4-sdl2
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build scrcpy 3.3.4 for Debian 12 / Core 2
    runs-on: ubuntu-22.04
    container:
      image: debian:12
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      CC: gcc
      CFLAGS: -O2 -pipe -march=core2 -mtune=core2
      CXXFLAGS: -O2 -pipe -march=core2 -mtune=core2

    steps:
      - name: Install build dependencies from Debian 12
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl unzip git \
            gcc g++ make pkg-config meson ninja-build \
            file tar gzip binutils \
            openjdk-17-jdk \
            libsdl2-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxinerama-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libudev-dev libusb-1.0-0-dev

      - name: Verify Debian multimedia development libraries
        shell: bash
        run: |
          set -euxo pipefail
          pkg-config --modversion sdl2
          pkg-config --modversion libavcodec
          pkg-config --modversion libavformat
          pkg-config --modversion libavutil
          pkg-config --modversion libswresample

      - name: Checkout workflow repository
        uses: actions/checkout@v5

      - name: Fetch upstream scrcpy 3.3.4 source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v3.3.4 https://github.com/Genymobile/scrcpy.git src
          test "$(git -C src describe --tags --exact-match)" = "v3.3.4"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "${ANDROID_HOME}/cmdline-tools"
          mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/latest"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build matching Android server
        shell: bash
        working-directory: src
        run: |
          set -euxo pipefail
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          ANDROID_PLATFORM=36 ANDROID_BUILD_TOOLS=36.0.0 BUILD_DIR="${PWD}/server/build_manual" ./server/build_without_gradle.sh
          test -s server/build_manual/scrcpy-server

      - name: Build scrcpy client against Debian libraries
        shell: bash
        working-directory: src
        run: |
          set -euxo pipefail
          meson setup build \
            --buildtype=release --strip -Db_lto=true -Dportable=false \
            -Dv4l2=false -Dprebuilt_server="${PWD}/server/build_manual/scrcpy-server"
          ninja -C build
          build/app/scrcpy --version

      - name: Verify CPU compatibility
        shell: bash
        working-directory: src
        run: |
          set -euxo pipefail
          if objdump -d build/app/scrcpy | grep -Eq '\\b(vmov|vadd|vsub|vp[a-z]+|vzeroupper|xsave|xgetbv)\\b'; then
            echo "Found newer CPU instructions in scrcpy"; exit 1
          fi
          file build/app/scrcpy
          ldd build/app/scrcpy
          if ldd build/app/scrcpy | grep -q "not found"; then
            echo "Unresolved shared library dependency"; exit 1
          fi

      - name: Assemble Debian 12 build archive
        shell: bash
        working-directory: src
        run: |
          set -euxo pipefail
          ROOT="${GITHUB_WORKSPACE}/dist/scrcpy-3.3.4-debian12-core2-x86_64"
          mkdir -p "${ROOT}"
          cp build/app/scrcpy "${ROOT}/scrcpy"
          cp server/build_manual/scrcpy-server "${ROOT}/scrcpy-server"
          cp LICENSE "${ROOT}/LICENSE"
          cat > "${ROOT}/README.md" <<'EOF'
          # scrcpy 3.3.4 — Debian 12 / Core 2

          x86_64 build compiled on Debian 12 Bookworm for older CPUs.

          - Upstream scrcpy: 3.3.4 (SDL2 version)
          - Uses Debian 12 system libraries: SDL2 and FFmpeg; they are not bundled
          - Compiler tuning: -O2 -pipe -march=core2 -mtune=core2
          - X11/OpenGL build for older Intel integrated graphics
          - Android server built from matching scrcpy 3.3.4 source

          Install runtime libraries if needed:
              sudo apt install libsdl2-2.0-0 libavcodec59 libavformat59 libavutil57 libswresample4

          Run ./scrcpy from this directory; keep scrcpy-server beside the executable.

          For older hardware, try:
              ./scrcpy --max-size=1024 --video-codec=h264 --no-audio
          EOF
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          tar -C "${GITHUB_WORKSPACE}/dist" -czf "${GITHUB_WORKSPACE}/dist/scrcpy-3.3.4-debian12-core2-x86_64.tar.gz" scrcpy-3.3.4-debian12-core2-x86_64

      - name: Verify archive and checksum
        shell: bash
        run: |
          set -euxo pipefail
          cd dist/scrcpy-3.3.4-debian12-core2-x86_64
          ./scrcpy --version
          ldd ./scrcpy
          cd "${GITHUB_WORKSPACE}"
          sha256sum dist/scrcpy-3.3.4-debian12-core2-x86_64.tar.gz > dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-3.3.4-debian12-core2-x86_64
          path: |
            dist/scrcpy-3.3.4-debian12-core2-x86_64.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish Debian 12 build
    needs: build
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v3.3.4-debian12-core2-system-libs
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: scrcpy-3.3.4-debian12-core2-x86_64
          path: dist
      - name: Publish release
        shell: bash
        run: |
          set -euxo pipefail
          test -s dist/scrcpy-3.3.4-debian12-core2-x86_64.tar.gz
          test -s dist/SHA256SUMS.txt
          cat > release-notes.md <<EOF
          ## scrcpy 3.3.4 — Debian 12 / Core 2 / system libraries

          x86_64 build for Debian 12 Bookworm and older CPUs.

          - Upstream scrcpy 3.3.4
          - Uses Debian 12's SDL2 and FFmpeg development/runtime libraries; no portable copies bundled
          - Core 2-compatible compiler tuning
          - X11/OpenGL support
          - Matching Android server built from scrcpy 3.3.4 source

          Build commit: ${GITHUB_SHA}
          EOF
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/scrcpy-3.3.4-debian12-core2-x86_64.tar.gz dist/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" dist/scrcpy-3.3.4-debian12-core2-x86_64.tar.gz dist/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --title "scrcpy 3.3.4 — Debian 12 / Core 2 / system libraries" --notes-file release-notes.md --target "${GITHUB_SHA}"
          fi
