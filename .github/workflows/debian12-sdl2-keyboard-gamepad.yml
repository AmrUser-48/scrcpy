name: Debian 12 scrcpy 3.3.4 / system libraries / Core 2 / keyboard gamepad

on:
  push:
    branches:
      - debian12-3.3.4-sdl2-keyboard-gamepad
  workflow_dispatch:

concurrency:
  group: scrcpy-debian12-3.3.4-sdl2-keyboard-gamepad
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Debian 12 Core 2 system-library release
    runs-on: ubuntu-22.04
    container:
      image: debian:12

    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      CC: gcc
      CFLAGS: -O3 -march=core2 -mtune=core2 -pipe -fomit-frame-pointer -ftree-vectorize -D_FORTIFY_SOURCE=2 -fstack-protector-strong -Wformat -Werror=format-security
      CXXFLAGS: -O3 -march=core2 -mtune=core2 -pipe -fomit-frame-pointer -ftree-vectorize -D_FORTIFY_SOURCE=2 -fstack-protector-strong -Wformat -Werror=format-security
      LDFLAGS: -Wl,-O1 -Wl,--as-needed -Wl,-z,relro -Wl,-z,now

    steps:
      - name: Install Debian 12 build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl unzip git \
            gcc g++ make pkg-config meson ninja-build \
            file tar gzip binutils \
            openjdk-17-jdk \
            libsdl2-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxinerama-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libudev-dev libusb-1.0-0-dev

      - name: Verify Debian multimedia libraries
        shell: bash
        run: |
          set -euxo pipefail
          pkg-config --modversion sdl2
          pkg-config --modversion libavcodec
          pkg-config --modversion libavformat
          pkg-config --modversion libavutil
          pkg-config --modversion libswresample

      - name: Checkout keyboard-gamepad branch
        uses: actions/checkout@v4

      - name: Verify source version and joystick implementation
        shell: bash
        run: |
          set -euxo pipefail
          grep -Eq "version: ['\"]3\\.3\\.4['\"]" meson.build
          grep -q 'sc_keyboard_gamepad_init' app/src/keyboard_gamepad.c
          grep -q 'opts->joystick' app/src/cli.c
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git log -1 --oneline

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "${ANDROID_HOME}/cmdline-tools"
          mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/latest"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build matching Android server
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          ANDROID_PLATFORM=36 \
          ANDROID_BUILD_TOOLS=36.0.0 \
          BUILD_DIR="${PWD}/server/build_manual" \
            ./server/build_without_gradle.sh
          test -s server/build_manual/scrcpy-server

      - name: Build stripped Core 2 client against Debian system libraries
        shell: bash
        run: |
          set -euxo pipefail
          meson setup build \
            --buildtype=release \
            --strip \
            -Db_lto=true \
            -Dstatic=false \
            -Dportable=true \
            -Dv4l2=false \
            -Dprebuilt_server="${PWD}/server/build_manual/scrcpy-server"
          ninja -C build
          build/app/scrcpy --version
          build/app/scrcpy --help | grep -A2 -- '--joystick'

      - name: Verify small dynamic binary and Core 2 compatibility
        shell: bash
        run: |
          set -euxo pipefail
          file build/app/scrcpy
          size=$(stat -c '%s' build/app/scrcpy)
          echo "scrcpy executable size: ${size} bytes"
          test "${size}" -lt 524288
          ldd build/app/scrcpy | tee /tmp/scrcpy-ldd.txt
          ! grep -q 'not found' /tmp/scrcpy-ldd.txt
          grep -q 'libSDL2-2.0.so' /tmp/scrcpy-ldd.txt
          grep -q 'libavcodec.so.59' /tmp/scrcpy-ldd.txt
          grep -q 'libavformat.so.59' /tmp/scrcpy-ldd.txt
          grep -q 'libavutil.so.57' /tmp/scrcpy-ldd.txt
          grep -q 'libswresample.so.4' /tmp/scrcpy-ldd.txt
          readelf -d build/app/scrcpy | grep NEEDED
          if objdump -d build/app/scrcpy | grep -Eq '\\b(vmov|vadd|vsub|vp[a-z]+|vzeroupper|xsave|xgetbv)\\b'; then
            echo "Found instructions unavailable on Core 2 in scrcpy"
            exit 1
          fi

      - name: Assemble Debian 12 build archive
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="${GITHUB_WORKSPACE}/dist/scrcpy-3.3.4-debian12-core2-keyboard-gamepad-x86_64"
          mkdir -p "${ROOT}"
          cp build/app/scrcpy "${ROOT}/scrcpy"
          cp server/build_manual/scrcpy-server "${ROOT}/scrcpy-server"
          cp LICENSE "${ROOT}/LICENSE"
          cat > "${ROOT}/README.md" <<'EOF'
          # scrcpy 3.3.4 — Debian 12 / Core 2 / system libraries

          x86_64 build for Debian 12 Bookworm and older CPUs.

          - Upstream scrcpy 3.3.4 with keyboard-to-gamepad support
          - Uses Debian 12 system SDL2 and FFmpeg shared libraries; none are bundled
          - Core 2 tuning: -O3 -march=core2 -mtune=core2 -pipe -fomit-frame-pointer -ftree-vectorize
          - Debian hardening: FORTIFY_SOURCE=2, stack protector, format-security, RELRO and NOW
          - X11/OpenGL support
          - Matching Android server built from this branch's scrcpy 3.3.4 source
          - --joystick / -j sends keyboard mappings through scrcpy's UHID gamepad path
          - No host uinput device required

          Runtime packages:
              sudo apt install adb libsdl2-2.0-0 libavcodec59 libavformat59 libavutil57 libswresample4 libusb-1.0-0

          Keep scrcpy-server beside scrcpy and run ./scrcpy from this directory.

          For older hardware, try:
              ./scrcpy --max-size=1024 --video-codec=h264 --no-audio
          EOF
          tar -C "${GITHUB_WORKSPACE}/dist" -czf \
            "${GITHUB_WORKSPACE}/dist/scrcpy-3.3.4-debian12-core2-keyboard-gamepad-x86_64.tar.gz" \
            scrcpy-3.3.4-debian12-core2-keyboard-gamepad-x86_64

      - name: Verify archive and generate checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd dist/scrcpy-3.3.4-debian12-core2-keyboard-gamepad-x86_64
          test -x ./scrcpy
          test -s ./scrcpy-server
          ./scrcpy --version
          ./scrcpy --help | grep -A2 -- '--joystick'
          ldd ./scrcpy
          cd "${GITHUB_WORKSPACE}"
          sha256sum dist/scrcpy-3.3.4-debian12-core2-keyboard-gamepad-x86_64.tar.gz > dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-3.3.4-debian12-core2-keyboard-gamepad-x86_64
          path: |
            dist/scrcpy-3.3.4-debian12-core2-keyboard-gamepad-x86_64.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish Debian 12 Core 2 keyboard-gamepad release
    needs: build
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v3.3.4-debian12-core2-keyboard-gamepad

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: scrcpy-3.3.4-debian12-core2-keyboard-gamepad-x86_64
          path: dist

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euxo pipefail
          test -s dist/scrcpy-3.3.4-debian12-core2-keyboard-gamepad-x86_64.tar.gz
          test -s dist/SHA256SUMS.txt
          cat > release-notes.md <<EOF
          ## scrcpy 3.3.4 — Debian 12 / Core 2 / system libraries

          x86_64 build for Debian 12 Bookworm and older CPUs.

          - Uses Debian 12 system SDL2 and FFmpeg shared libraries; no portable copies bundled
          - Stripped Core 2-compatible client: -O3 -march=core2 -mtune=core2 -pipe -fomit-frame-pointer -ftree-vectorize
          - Debian hardening remains enabled (FORTIFY_SOURCE, stack protector, RELRO/NOW)
          - X11/OpenGL support
          - Keyboard gamepad: --joystick / -j
          - Matching Android server built from the same keyboard-gamepad branch

          Client executable size is recorded in the build logs. Runtime SDL2 and FFmpeg libraries are provided by Debian 12.

          Build commit: ${GITHUB_SHA}
          EOF
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              dist/scrcpy-3.3.4-debian12-core2-keyboard-gamepad-x86_64.tar.gz \
              dist/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" \
              dist/scrcpy-3.3.4-debian12-core2-keyboard-gamepad-x86_64.tar.gz \
              dist/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "scrcpy 3.3.4 — Debian 12 / Core 2 / keyboard gamepad" \
              --notes-file release-notes.md \
              --target "${GITHUB_SHA}"
          fi
