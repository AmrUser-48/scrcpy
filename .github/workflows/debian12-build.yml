name: Debian 12 compatible scrcpy 2.7

on:
  push:
    branches:
      - debian12-2.7
  workflow_dispatch:

jobs:
  build-linux-debian12:
    name: Build Linux x86_64 on Debian 12
    runs-on: ubuntu-22.04
    container:
      image: debian:12

    env:
      DEBIAN_FRONTEND: noninteractive
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      CFLAGS: -march=core2 -mtune=core2
      CC: gcc

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl unzip git \
            gcc make pkg-config meson ninja-build nasm \
            openjdk-17-jdk \
            libavcodec-dev libavdevice-dev libavformat-dev libavutil-dev \
            libswresample-dev libsdl2-dev libusb-1.0-0-dev \
            dpkg-dev binutils file tar gzip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "${ANDROID_HOME}/cmdline-tools"
          mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/latest"
          rm -f /tmp/cmdline-tools.zip
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Android server from source
        run: |
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          export ANDROID_HOME
          export ANDROID_SDK_ROOT
          ANDROID_PLATFORM=34 \
          ANDROID_BUILD_TOOLS=34.0.0 \
          BUILD_DIR="${PWD}/server/build_manual" \
          ./server/build_without_gradle.sh

      - name: Build Linux client
        run: |
          meson setup build \
            --buildtype=release \
            --strip \
            -Db_lto=true \
            -Dportable=true \
            -Dprebuilt_server=server/build_manual/scrcpy-server
          ninja -C build

      - name: Verify binary
        run: |
          file build/app/scrcpy
          build/app/scrcpy --version
          readelf -d build/app/scrcpy | grep NEEDED
          if objdump -d build/app/scrcpy | grep -Eq '\\b(vmov|vadd|vsub|vp[a-z]+|vzeroupper)'; then
            echo "Unexpected AVX/AVX2-style instructions found in scrcpy client"
            exit 1
          fi

      - name: Package Debian 12 tarball
        run: |
          PKG="dist/scrcpy-2.7-debian12-x86_64"
          mkdir -p "${PKG}"
          cp build/app/scrcpy "${PKG}/scrcpy"
          cp build/server/scrcpy-server "${PKG}/scrcpy-server"
          cp LICENSE "${PKG}/LICENSE"
          cp README.md "${PKG}/README-upstream.md"
          cat > "${PKG}/README-debian12.md" <<'EOF'
          # scrcpy 2.7 - Debian 12 x86_64 build

          This build is compiled on Debian 12 (Bookworm) against Debian 12's
          native SDL2 and FFmpeg libraries.

          Target CPU: Intel Core 2 / x86-64 with Core 2 tuning.

          Runtime packages:
          adb ffmpeg libsdl2-2.0-0 libavcodec59 libavdevice59 libavformat59
          libavutil57 libswresample4 libusb-1.0-0

          Recommended settings for low-end hosts such as a Core 2 Duo T7250:
              ./scrcpy --max-size=1024 --video-codec=h264 --no-audio

          Huawei DUB-LX1 / Android 8.1 recommended encoder:
              --video-codec=h264
              --video-encoder=OMX.qcom.video.encoder.avc

          The bundled scrcpy-server matches client version 2.7.
          EOF
          tar -C dist -czf dist/scrcpy-2.7-debian12-x86_64.tar.gz \
            "scrcpy-2.7-debian12-x86_64"

      - name: Package Debian 12 .deb
        run: |
          ROOT="dist/deb"
          mkdir -p "${ROOT}/DEBIAN" "${ROOT}/usr/bin" "${ROOT}/usr/share/scrcpy"
          cp build/app/scrcpy "${ROOT}/usr/bin/scrcpy"
          cp build/server/scrcpy-server "${ROOT}/usr/share/scrcpy/scrcpy-server"
          cat > "${ROOT}/DEBIAN/control" <<'EOF'
          Package: scrcpy-debian12
          Version: 2.7.0-1
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: AmrUser-48
          Depends: adb, libsdl2-2.0-0, libavcodec59, libavdevice59, libavformat59, libavutil57, libswresample4, libusb-1.0-0
          Description: scrcpy 2.7 built natively for Debian 12
           Debian 12-compatible scrcpy 2.7 client and matching Android server.
          EOF
          dpkg-deb --build --root-owner-group "${ROOT}" \
            dist/scrcpy-2.7-debian12-x86_64.deb

      - name: Generate checksums
        run: |
          sha256sum \
            dist/scrcpy-2.7-debian12-x86_64.tar.gz \
            dist/scrcpy-2.7-debian12-x86_64.deb \
            > dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-2.7-debian12-x86_64
          path: |
            dist/scrcpy-2.7-debian12-x86_64.tar.gz
            dist/scrcpy-2.7-debian12-x86_64.deb
            dist/SHA256SUMS.txt
          if-no-files-found: error
